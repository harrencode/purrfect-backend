name: Migrate DB (Render)
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook for migrations
        env:
          RENDER_MIGRATE_HOOK: ${{ secrets.RENDER_MIGRATE_HOOK }}
        run: |
          if [ -z "$RENDER_MIGRATE_HOOK" ]; then
            echo "RENDER_MIGRATE_HOOK is not set"
            exit 1
          fi
          curl -fsSL "$RENDER_MIGRATE_HOOK"
